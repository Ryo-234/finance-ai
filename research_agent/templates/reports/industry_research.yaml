# 行业研究报告模板
report_type: industry_research
name: "行业深度研究报告"
description: "适用于券商行业分析，覆盖行业全景、竞争格局、趋势研判"

sections:
  - id: summary
    title: "投资摘要"
    word_count: 200
    prompt: |
      用精炼的语言总结本报告的核心观点：
      1. 行业当前所处周期阶段
      2. 2-3 个关键发现
      3. 核心结论（非投资建议）
    required_sources: []

  - id: industry_overview
    title: "行业概况"
    word_count: 500
    prompt: |
      描述该行业的：
      1. 定义与边界（产业链上下游）
      2. 市场规模（近 3 年数据，用表格呈现）
      3. 发展阶段（导入期/成长期/成熟期/衰退期）
      4. 政策环境（列出近一年重要政策及其影响）
    required_sources: ["eastmoney", "sina_finance"]

  - id: competition
    title: "竞争格局"
    word_count: 500
    prompt: |
      分析行业的竞争态势：
      1. 市场集中度（CR5、CR10）
      2. 主要玩家及市场份额（用表格）
      3. 竞争壁垒（技术/品牌/规模/政策）
      4. 波特五力分析简述
    required_sources: ["eastmoney"]

  - id: trend
    title: "趋势研判"
    word_count: 400
    prompt: |
      基于当前数据和行业规律，分析：
      1. 短期趋势（6-12 个月）
      2. 中期趋势（1-3 年）
      3. 关键变量（政策变化、技术突破、需求波动）
      4. 潜在风险因素
    required_sources: ["sina_finance"]

  - id: risk
    title: "风险提示"
    word_count: 200
    prompt: |
      列出本行业面临的主要风险：
      1. 政策风险
      2. 市场风险
      3. 技术替代风险
      4. 其他重大不确定性
    required_sources: []

compliance:
  disclaimer_at: "risk"  # 免责声明插入位置
  ai_marker_at: "header"  # AI 标识位置
